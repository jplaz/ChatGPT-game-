name: Copy Claude game into this repo

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  mirror:
    if: github.event.head_commit.message != 'Mirror current Claude game version'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone current Claude game source
        run: |
          git clone --depth 1 --branch 'claude/pokemon-got-emerald-game-jfypcy' https://github.com/jplaz/Game.git /tmp/source-game

      - name: Replace destination with source snapshot
        run: |
          rsync -a --delete --exclude='.git' /tmp/source-game/ ./
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Mirror current Claude game version'
          git push origin main
